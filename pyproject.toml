[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synthforge"
version = "0.0.1"
description = "Program synthesis and test-based evaluation framework"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Wen Tao" }]

[project.urls]
Homepage = "https://github.com/cwalker64/synthforge"
Documentation = "https://github.com/cwalker64/synthforge/tree/main/docs"
Issues = "https://github.com/cwalker64/synthforge/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.8",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["synthforge", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["synthforge"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["synthforge"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
